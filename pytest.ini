[pytest]
testpaths = tests
asyncio_mode = auto
log_cli = true
log_cli_level = WARNING

# Marcadores
markers =
    unit: Tests unitarios (sin dependencias externas)
    integration: Tests de integración (mocks de servicios)
    e2e: Tests end-to-end de la API
    smoke: Smoke tests rápidos de sanidad

# Filtros de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
