services:
  web:
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
    environment:
      APP_ENVIRONMENT: production
      SESSION_SECURE_COOKIE: "true"

  worker:
    command: python /app/worker.py
    volumes:
      - ./data:/app/data
    environment:
      APP_ENVIRONMENT: production

  promtail:
    image: grafana/promtail:3.6.0
