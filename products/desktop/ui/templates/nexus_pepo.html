<!DOCTYPE html>
<!-- open-nexus desktop — PEPO: agente personal polivalente -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus · PEPO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/nexus_v1.css?v=20260626c">
    <link rel="stylesheet" href="/static/css/desktop_nav.css?v=20260615b">
    <link rel="stylesheet" href="/static/css/nexus_pepo.css?v=20260803d">
</head>
<body>
    <main class="workspace workspace-pepo">

        <!-- ── Topbar ─────────────────────────────────────────────────────── -->
        <header class="shell-topbar">
            <div class="brand-cluster brand-cluster-compact">
                <h1>PEPO</h1>
            </div>
            {% include "partials/desktop_nav.html" %}
        </header>

        <!-- ── Split 70/30 ────────────────────────────────────────────────── -->
        <div class="pepo-layout">

            <!-- ── CHAT (70%) ─────────────────────────────────────────────── -->
            <section class="pepo-panel">

                <div class="pepo-panel-head">
                    <div>
                        <p class="eyebrow eyebrow-tight">Agente personal</p>
                        <h2>Chat con PEPO</h2>
                    </div>
                    <div class="inline-badges">
                        <span class="badge">polivalente</span>
                        <span class="badge badge-muted" id="pepoChatStatus">listo</span>
                    </div>
                </div>

                <!-- Historial -->
                <div id="pepoChatLog" class="pepo-chat-log">
                    <div class="pepo-msg pepo-msg-pepo">
                        <p class="pepo-msg-role">PEPO</p>
                        <div class="pepo-bubble">Hola. Soy PEPO, tu agente personal. Puedo ayudarte con operaciones, prospección comercial, incidentes y más. También puedes lanzar skills desde el panel de la derecha. ¿En qué empezamos?</div>
                    </div>
                </div>

                <!-- Chips de acceso rápido -->
                <div class="pepo-chips">
                    <button class="pepo-chip" type="button"
                        data-pepo-prompt="¿Cuál es el estado operativo general del sistema?">Estado del sistema</button>
                    <button class="pepo-chip" type="button"
                        data-pepo-prompt="Resume la actividad comercial reciente y los siguientes pasos">Actividad comercial</button>
                    <button class="pepo-chip" type="button"
                        data-pepo-prompt="¿Hay incidentes o alertas que requieran atención inmediata?">Alertas urgentes</button>
                    <button class="pepo-chip" type="button"
                        data-pepo-prompt="Propón una búsqueda de leads para este mes">Proponer prospección</button>
                </div>

                <!-- Compositor -->
                <form id="pepoChatForm" class="pepo-composer">
                    <textarea
                        id="pepoInput"
                        class="pepo-composer-textarea"
                        rows="1"
                        placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter para nueva línea)"></textarea>
                    <button id="pepoChatSendBtn" class="btn" type="submit">Enviar</button>
                </form>

            </section>

            <aside class="pepo-panel pepo-skills-panel"></aside>

        </div><!-- /.pepo-layout -->

    </main>

    <script src="/static/js/nexus_pepo.js?v=20260803d"></script>
</body>
</html>
